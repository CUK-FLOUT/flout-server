spring:
  application:
    name: flout-server
  profiles:
    default: local
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: flout
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
  consent:
    terms-version: ${TERMS_VERSION:1.0}
    privacy-version: ${PRIVACY_VERSION:1.0}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    connect-timeout-millis: 3000
    read-timeout-millis: 3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
