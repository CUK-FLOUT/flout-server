spring:
  application:
    name: flout-server
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 80MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  fcm:
    enabled: ${FCM_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:}
    interval-millis: ${FCM_INTERVAL_MILLIS:5000}
  s3:
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
  inspection:
    auto-start:
      enabled: ${INSPECTION_AUTO_START_ENABLED:true}
      interval-millis: ${INSPECTION_AUTO_START_INTERVAL_MILLIS:5000}
  construction:
    auto-start:
      enabled: ${CONSTRUCTION_AUTO_START_ENABLED:true}
      interval-millis: ${CONSTRUCTION_AUTO_START_INTERVAL_MILLIS:5000}
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: flout
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:604800}
  consent:
    third-party-provision-version: ${THIRD_PARTY_PROVISION_VERSION:1.0}
    status-notification-version: ${STATUS_NOTIFICATION_VERSION:1.0}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    connect-timeout-millis: 3000
    read-timeout-millis: 3000
  juso:
    confirm-key: ${JUSO_CONFIRM_KEY:}
    base-url: https://business.juso.go.kr
    connect-timeout-millis: 3000
    read-timeout-millis: 3000
  ai:
    base-url: ${AI_MODEL_BASE_URL:http://localhost:8000}
    predict-path: ${AI_MODEL_PREDICT_PATH:/api/vulnerability}
    connect-timeout-millis: ${AI_MODEL_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${AI_MODEL_READ_TIMEOUT_MILLIS:10000}
  guide-ai:
    base-url: ${GUIDE_AI_BASE_URL:http://localhost:8001}
    generate-path: ${GUIDE_AI_GENERATE_PATH:/api/v1/guides/generate}
    api-key: ${GUIDE_AI_API_KEY:}
    connect-timeout-millis: ${GUIDE_AI_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${GUIDE_AI_READ_TIMEOUT_MILLIS:15000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
