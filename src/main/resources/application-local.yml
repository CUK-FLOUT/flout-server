app:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:256860334030-f3od5skin0p2cqrpu9ui222g6pv4aeai.apps.googleusercontent.com}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:flout-dev-files-kr}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flout}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:flout}
    password: ${DB_PASSWORD:flout}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
