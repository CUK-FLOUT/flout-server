name: Issue Title

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  prefix-issue-number:
    name: Prefix Issue Number
    runs-on: ubuntu-latest
    steps:
      - name: Add FLOUT ticket number to issue title
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const ticketPrefix = `[FLOUT-${issue.number}]`;

            const existingPrefix = issue.title.match(/^\[FLOUT-(\d+)\]\s*/);

            if (existingPrefix?.[1] === String(issue.number)) {
              core.info(`Issue title already has a ticket prefix: ${issue.title}`);
              return;
            }

            const titleWithoutPrefix = issue.title
              .replace(/^\[FLOUT-\d+\]\s*/, "")
              .trim();

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: `${ticketPrefix} ${titleWithoutPrefix}`,
            });
